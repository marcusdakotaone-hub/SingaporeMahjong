<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singapore Mahjong - Wind & Animal Selector</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="home-screen">

        <section class="table">

            <h1>Singapore Mahjong</h1>

            <p class="subtitle">
                Wind & Animal Selector
            </p>

            <div class="mahjong-tiles">

                <div class="tile">東</div>
                <div class="tile">南</div>
                <div class="tile">西</div>
                <div class="tile">北</div>

            </div>

            <button id="startButton">
                Start Game
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
